[job]
dump_folder = "./outputs"
description = "Mamba2 130M training"
print_config = false

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 10
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 10
disable_color_printing = false
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = false

[model]
name = "mamba2"
flavor = "130M"
# Download a tokenizer from HuggingFace, e.g., meta-llama/Llama-3.2-1B
# Or use the test tokenizer for quick testing
hf_assets_path = "./tests/assets/tokenizer"

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8
weight_decay = 0.1

[lr_scheduler]
warmup_steps = 200  # lr scheduler warm up, normally 20% of the train steps
decay_ratio = 0.8  # lr scheduler decay ratio, 80% of the train steps
decay_type = "cosine"
min_lr_factor = 0.1

[training]
local_batch_size = 2  # Smaller batch for larger model
seq_len = 2048  # Using efficient scan - can handle longer sequences
max_norm = 1.0  # grad norm clipping
steps = 1000
dataset = "c4_test"  # Use c4_test for quick testing, or "c4" for full dataset

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default" # default / never / always
tensor_parallel_degree = 1  # TP not supported for Mamba2
enable_async_tensor_parallel = false
pipeline_parallel_degree = 1
pipeline_parallel_schedule = "Interleaved1F1B"
context_parallel_degree = 1

[checkpoint]
enable = false
folder = "checkpoint"
interval = 100
last_save_model_only = false
export_dtype = "float32"
async_mode = "disabled"  # ["disabled", "async", "async_with_pinned_mem"]

[activation_checkpoint]
mode = "selective"  # ["none", "selective", "full"] - Use selective to reduce memory
selective_ac_option = '4'  # AC every 4 layers (16 layers / 4 = 4 checkpoints)

[compile]
enable = false  # Disable initially for safer testing, enable after validating correctness
components = ["model", "loss"]

[quantize.linear.float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output"]

[validation]
enable = false
dataset = "c4_validation"
freq = 100
steps = 10
